<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: #1e293b;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 32px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 24px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      color: #334155;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    input[type="tel"]:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .input-error {
      border-color: #ef4444 !important;
    }

    .input-error:focus {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15) !important;
    }

    .error-text {
      color: #dc2626;
      font-size: 0.825rem;
      font-weight: 500;
    }

    .radio-group {
      display: flex;
      gap: 20px;
      margin-top: 4px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 400;
      cursor: pointer;
    }

    .radio-label input[type="radio"] {
      accent-color: #2563eb;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .submit-btn {
      margin-top: 8px;
      padding: 12px 20px;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .submit-btn:hover {
      background-color: #1d4ed8;
    }

    .empty-message {
      color: #64748b;
      font-size: 0.95rem;
      text-align: center;
      padding: 24px 0;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.925rem;
    }

    th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
      padding: 12px 16px;
      border-bottom: 1px solid #e2e8f0;
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .font-semibold {
      font-weight: 600;
      color: #0f172a;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      background-color: #eff6ff;
      color: #1d4ed8;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
  </style>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function StudentRegistration() {
      const initialFormData = {
        name: "",
        email: "",
        phone: "",
        course: "",
        gender: ""
      };

      const [formData, setFormData] = useState(initialFormData);
      const [errors, setErrors] = useState({});
      const [students, setStudents] = useState([]);

      const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData((prev) => ({ ...prev, [name]: value }));
        if (errors[name]) {
          setErrors((prev) => ({ ...prev, [name]: "" }));
        }
      };

      const validate = () => {
        const newErrors = {};

        if (!formData.name.trim()) {
          newErrors.name = "Student name is required";
        }

        if (!formData.email.trim()) {
          newErrors.email = "Email address is required";
        } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(formData.email.trim())) {
          newErrors.email = "Enter a valid email address";
        }

        if (!formData.phone.trim()) {
          newErrors.phone = "Phone number is required";
        } else if (!/^\d{10}$/.test(formData.phone.replace(/[\s-]/g, ""))) {
          newErrors.phone = "Phone number must be a valid 10-digit number";
        }

        if (!formData.course) {
          newErrors.course = "Please select a course / department";
        }

        if (!formData.gender) {
          newErrors.gender = "Please select a gender";
        }

        return newErrors;
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        const validationErrors = validate();

        if (Object.keys(validationErrors).length > 0) {
          setErrors(validationErrors);
          return;
        }

        setStudents((prev) => [
          ...prev,
          {
            ...formData,
            id: Date.now(),
            phone: formData.phone.replace(/[\s-]/g, "")
          }
        ]);
        setFormData(initialFormData);
        setErrors({});
      };

      return (
        <div className="container">
          <div className="card">
            <h2>Student Registration Form</h2>
            <form onSubmit={handleSubmit} noValidate>
              <div className="form-group">
                <label htmlFor="name">Student Name</label>
                <input
                  id="name"
                  type="text"
                  name="name"
                  value={formData.name}
                  onChange={handleChange}
                  placeholder="Enter full name"
                  className={errors.name ? "input-error" : ""}
                />
                {errors.name && <span className="error-text">{errors.name}</span>}
              </div>

              <div className="form-group">
                <label htmlFor="email">Email Address</label>
                <input
                  id="email"
                  type="email"
                  name="email"
                  value={formData.email}
                  onChange={handleChange}
                  placeholder="student@example.com"
                  className={errors.email ? "input-error" : ""}
                />
                {errors.email && <span className="error-text">{errors.email}</span>}
              </div>

              <div className="form-group">
                <label htmlFor="phone">Phone Number</label>
                <input
                  id="phone"
                  type="tel"
                  name="phone"
                  value={formData.phone}
                  onChange={handleChange}
                  placeholder="10-digit mobile number"
                  className={errors.phone ? "input-error" : ""}
                />
                {errors.phone && <span className="error-text">{errors.phone}</span>}
              </div>

              <div className="form-group">
                <label htmlFor="course">Course / Department</label>
                <select
                  id="course"
                  name="course"
                  value={formData.course}
                  onChange={handleChange}
                  className={errors.course ? "input-error" : ""}
                >
                  <option value="">Select course or department</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Mechanical Engineering">Mechanical Engineering</option>
                  <option value="Electrical Engineering">Electrical Engineering</option>
                  <option value="Civil Engineering">Civil Engineering</option>
                  <option value="Business Administration">Business Administration</option>
                </select>
                {errors.course && <span className="error-text">{errors.course}</span>}
              </div>

              <div className="form-group">
                <label>Gender</label>
                <div className="radio-group">
                  {["Male", "Female", "Other"].map((item) => (
                    <label key={item} className="radio-label">
                      <input
                        type="radio"
                        name="gender"
                        value={item}
                        checked={formData.gender === item}
                        onChange={handleChange}
                      />
                      <span>{item}</span>
                    </label>
                  ))}
                </div>
                {errors.gender && <span className="error-text">{errors.gender}</span>}
              </div>

              <button type="submit" className="submit-btn">
                Register Student
              </button>
            </form>
          </div>

          <div className="card">
            <h2>Registered Students ({students.length})</h2>
            {students.length === 0 ? (
              <p className="empty-message">No students registered yet.</p>
            ) : (
              <div className="table-wrapper">
                <table>
                  <thead>
                    <tr>
                      <th>#</th>
                      <th>Name</th>
                      <th>Email</th>
                      <th>Phone</th>
                      <th>Course</th>
                      <th>Gender</th>
                    </tr>
                  </thead>
                  <tbody>
                    {students.map((student, index) => (
                      <tr key={student.id}>
                        <td>{index + 1}</td>
                        <td className="font-semibold">{student.name}</td>
                        <td>{student.email}</td>
                        <td>{student.phone}</td>
                        <td>
                          <span className="badge">{student.course}</span>
                        </td>
                        <td>{student.gender}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<StudentRegistration />);
  </script>
</body>
</html>
